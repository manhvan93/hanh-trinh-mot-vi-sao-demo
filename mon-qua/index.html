<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b20">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="data:,">
  <title>Hành trình của một vì sao</title>
  <style>
    html, body { margin: 0; height: 100%; background: #080b20; color: #fff0d1; }
    body { display: grid; place-items: center; font: 1rem/1.65 system-ui, sans-serif; }
    main { width: min(28rem, 80vw); text-align: center; }
    h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2.6rem); line-height: 1.2; }
    p { margin: 1rem 0 0; color: #d5cbeb; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #080b20; }
  </style>
  <script src="./viewer.js" defer></script>
</head>
<body>
  <main id="status">
    <h1>Hành trình của một vì sao</h1>
    <p id="message" role="status">Đang mở món quà…</p>
    <noscript><p>Hãy bật JavaScript trong trình duyệt để mở món quà.</p></noscript>
  </main>
</body>
</html>
